<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Valyuta AI</title>
<script src="https://telegram.org"></script>
<style>
  body { background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 16px; }
  .header { text-align: center; margin-bottom: 14px; }
  .header h2 { margin: 0; font-size: 20px; }
  .header p { margin: 4px 0 0; font-size: 12px; color: #94a3b8; }
  .card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; }
  input { width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-size: 20px; font-weight: bold; outline: none; }
  select { background: #3b82f6; color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 16px; font-weight: bold; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; }
  .chip { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 20px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #334155; }
  .item:last-child { border-bottom: none; }
  .val { font-size: 17px; font-weight: bold; text-align: right; }
  .sub { font-size: 11px; color: #94a3b8; display: block; }
  .btn { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: bold; margin-top: 6px; }
</style>
</head>
<body>
<div class="header">
  <h2>💱 Valyuta AI • Kalkulyator</h2>
  <p id="dt">Jonli kurs: Tayyor</p>
</div>
<div class="card">
  <div class="row">
    <input type="number" id="amt" value="100" oninput="calc()">
    <select id="ccy" onchange="calc()">
      <option value="USD">🇺🇸 USD</option>
      <option value="RUB">🇷🇺 RUB</option>
      <option value="UZS">🇺🇿 UZS</option>
      <option value="EUR">🇪🇺 EUR</option>
      <option value="KZT">🇰🇿 KZT</option>
      <option value="TRY">🇹🇷 TRY</option>
    </select>
  </div>
  <div class="chips">
    <div class="chip" onclick="setA(0)">0</div>
    <div class="chip" onclick="setA(100)">100</div>
    <div class="chip" onclick="setA(1000)">1 000</div>
    <div class="chip" onclick="setA(10000)">10 000</div>
    <div class="chip" onclick="setA(1000000)">1 mln</div>
    <div class="chip" onclick="setA(1000000000)">1 mlrd</div>
    <div class="chip" onclick="setA(1000000000000)">1 trln</div>
  </div>
</div>
<div class="card" id="res"></div>
<button class="btn" onclick="send()">📤 Natijani chatga yuborish</button>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) tg.expand();

var rates = { UZS: 1, USD: 12850, RUB: 132, EUR: 13600, KZT: 25.5, TRY: 370 };
var names = { UZS: "🇺🇿 So'm", USD: "🇺🇸 Dollar", RUB: "🇷🇺 Rubl", EUR: "🇪🇺 Yevro", KZT: "🇰🇿 Tenge", TRY: "🇹🇷 Lira" };

function human(v) {
  if (v >= 1e15) return (v / 1e15).toFixed(2) + " kvadrillion";
  if (v >= 1e12) return (v / 1e12).toFixed(2) + " trillion";
  if (v >= 1e9) return (v / 1e9).toFixed(2) + " milliard";
  if (v >= 1e6) return (v / 1e6).toFixed(2) + " million";
  return "";
}

function setA(v) { document.getElementById("amt").value = v; calc(); }

function calc() {
  var a = parseFloat(document.getElementById("amt").value) || 0;
  var f = document.getElementById("ccy").value;
  var uzs = a * rates[f];
  var h = "";
  for (var k in rates) {
    if (k !== f) {
      var v = uzs / rates[k];
      h += '<div class="item"><span>' + names[k] + ' (' + k + ')</span><div class="val">' + v.toLocaleString("en-US", {maximumFractionDigits: 2}) + '<span class="sub">' + human(v) + '</span></div></div>';
    }
  }
  document.getElementById("res").innerHTML = h;
}

function send() {
  if (tg) tg.sendData((document.getElementById("amt").value || 0) + " " + document.getElementById("ccy").value);
}

calc();

fetch("https://er-api.com")
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d && d.rates) {
      var u = d.rates.UZS;
      rates.USD = u;
      rates.RUB = u / d.rates.RUB;
      rates.EUR = u / d.rates.EUR;
      rates.KZT = u / d.rates.KZT;
      rates.TRY = u / d.rates.TRY;
      document.getElementById("dt").innerText = "Jonli bozor kursi • Yangilandi";
      calc();
    }
  });
</script>
</body>
</html>
